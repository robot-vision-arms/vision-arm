# ur5e_pick_place 파라미터. sim.launch.py 가 static TF(base_link → work_plane) 도 이 값으로 만든다.
pick_place_node:
  ros__parameters:
    use_sim_time: true
    world_name: "workcell"         # worlds/workcell.sdf 의 <world name>
    world_file: ""                 # 비우면 worlds/<world_name>.sdf. 이 파일의 고정 물체(상자·바닥)를 MoveIt 충돌 물체로 등록
    max_objects: 3                 # 한 사이클에 집는 최대 개수. urdf/ur5e_vacuum.urdf.xacro 의 슬롯 수와 같아야 함

    # 작업 시트(work_plane)를 Gazebo 안 어디에 둘지 (base_link 기준, m / deg).
    # 실제 종이 원점이 여기 놓였다고 보고 비전 mm 좌표를 옮긴다. worlds/workcell.sdf 의 work_mat 위치와 맞출 것.
    # x=0.30 은 UR5e(도달 반경 약 0.85 m)가 A4(297x210 mm) 전체를 위에서 내려다보며 닿는 거리로 잡은 초기값
    work_plane_x: 0.30
    work_plane_y: -0.15
    work_plane_z: 0.0
    work_plane_yaw_deg: 0.0

    tool_length_m: 0.05            # tool0 → 흡착 패드 끝. urdf/ur5e_vacuum.urdf.xacro 의 pad_length 와 맞출 것
    grasp_gap_m: 0.0005            # 컵 끝을 부품 윗면 0.5 mm 위에서 멈추고 진공 ON (닿으면 물리 엔진이 밀어냄. 팀원 2 투입 검사 값)
    grasp_attempts: 3              # 진공이 '떨어져 있음' 이면 1 mm 씩 더 내려 다시 (최대 횟수)
    approach_height_m: 0.10        # 접근 높이 (부품 윗면 위)
    lift_height_m: 0.15            # 흡착 후 들어 올리는 컵 끝 높이 (작업 평면 위)

    # 분류 대상과 상자. 같은 순서의 병렬 배열 (ROS 파라미터는 dict 목록을 못 받음).
    # 공구 종류를 늘릴 때: models/<type>/ 추가 → 여기 한 칸씩 추가 → workcell.sdf 에 <type>_bin 추가. 코드는 안 바꾼다
    # 상자는 로봇 좌우에 배치한다. 중심은 base_link 기준 (0, +0.85), (0, -0.85)m.
    part_types: ["screw", "nut"]
    bin_x: [0.0, 0.0]
    bin_y: [0.85, -0.85]
    bin_drop_z: 0.15               # 상자 위 놓는 높이 (패드 끝 기준)
    # 대기 자세: 작업 시트 좌표 (ready_x_mm, ready_y_mm) 의 컵 끝 높이 travel_height_m. 첫 사이클에 관절 각도를 저장해
    # 상자 ↔ 작업 매트 큰 이동은 관절 각도 목표로 한다 (좌표 목표는 OMPL 이 자주 못 풂, 11-20). 부품 사이 이동 높이도 같다.
    # 가상 카메라 시야 밖이어야 한다: 0.25 m 높이에서 카메라는 base x 0.31~0.59 m 를 본다. 시트 가운데 위에 두었더니
    # 손목이 화면을 가리고 '나사' 로 검출됐다 (11-20 GUI 확인). 시트 아래쪽 밖 (148.5, -80) mm = base (0.45, -0.23) m:
    # 0.25 m 높이에서 카메라는 base y -0.12 ~ +0.03 m 만 본다. (시트 왼쪽 밖 base x 0.20 m 는 베이스에 너무 가까워 역기구학 실패)
    ready_x_mm: 148.5
    ready_y_mm: -80.0
    # 위 위치의 관절 각도 (rad). 시작 자세(팔을 곧게 세움)는 특이 자세라 역기구학이 자주 실패해서 관절 각도로 고정한다.
    # 11-20 시험에서 위 위치로 간 실제 관절값에서 360° 감긴 것만 펴서 넣었다. 위치를 바꾸면 이 값도 다시 정한다 (빼면 역기구학으로 구함)
    ready_joints: [-0.741, -1.039, 1.373, 1.238, 1.570, 0.829]
    travel_height_m: 0.25
    settle_s: 3.0                  # 놓은 뒤 부품이 상자 안에서 멈출 때까지 기다리는 시간
    max_velocity_scaling: 0.3      # 시뮬레이션이 느린 WSL2 에서 궤적 추종 오차를 줄이려고 낮춘 초기값
    # 2주차 지정 좌표 이동. /sim/move_to_target (std_srvs/srv/Trigger) 호출 시 적용
    target_x_mm: 100.0
    target_y_mm: 100.0
    target_angle_deg: 0.0
    target_height_m: 0.25         # 이동 확인용 작업면 → 패드 끝 높이. tool0에는 tool_length_m을 더함
    motion_timeout_s: 30.0
    planning_time_s: 10.0          # OMPL 이 길을 찾는 최대 시간 (시도 1번당). 5초에서 첫 이동이 3회 실패한 기록이 있어 10초 (팀원 2, 11-19)
    plan_attempts: 3               # 계획만 실패했을 때(로봇은 안 움직임) 최대 시도 횟수. 1 이면 다시 시도 안 함
    plan_retry_delay_s: 2.0        # 다시 시도 전 쉬는 시간
    joint_state_wait_s: 10.0       # 첫 이동 전에 /joint_states 를 기다리는 최대 시간
    service_timeout_s: 30.0        # 스폰·진공 서비스(스폰 노드) 응답 대기
