# ros2 launch 시 노드에 전달되는 파라미터. 경로는 워크스페이스 루트(~/vision-arm) 기준.
vision_node:
  ros__parameters:
    camera_url: "rtsp://172.20.10.1:8554/live"             # 스마트폰 IP 카메라 영상 주소 (예: http://192.168.0.23:8080/video). docs/SETUP.md Step 7
    camera_index: 0              # camera_url 이 비어 있을 때 쓰는 USB 카메라 번호 (/dev/video0)
    camera_rotate_deg: 0         # 카메라 영상 회전 (시계 방향 0·90·180·270). 폰 앱이 세로 720x1280 로 보내면 270 → 가로 1280x720. 보정 사진도 같은 회전으로
    image_dir: ""                # 값이 있으면 카메라 대신 폴더 이미지·동영상 파일을 순서대로 재생 (대체 입력)
    intrinsics_path: "data/calib/intrinsics.npz"   # scripts/calibrate_camera.py 출력
    homography_path: "data/calib/homography.npz"   # scripts/compute_homography.py 출력
    blur_ksize: 5                # Gaussian Blur 커널(홀수). 초기값, 실험으로 조정
    threshold: -1                # -1 이면 Otsu 자동 임계값
    segmentation_mode: "gray"   # 기본 단색 배경용. MVTec의 나무 배경은 params_mvtec.yaml의 metal_hsv 사용
    hsv_max_saturation: 70      # metal_hsv: 저채도 금속 선택 (0~255)
    hsv_max_dark_value: 70      # metal_hsv: 어두운 부품도 선택 (0~255)
    close_ksize: 0              # 0이면 끔, 양의 홀수. 작은 틈 메우기
    open_ksize: 0               # 0이면 끔, 양의 홀수. 작은 잡음 제거
    min_area_px: 500             # 이보다 작은 윤곽선은 노이즈로 버림. 초기값, 실험으로 조정
    nut_max_aspect: 1.5          # 장축/단축 비가 이 이하면 너트, 넘으면 나사. 초기값, MVTec 비율 분포 보고 조정
    publish_rate_hz: 10.0
    sheet_roi: true              # 보정됐을 때 작업 시트 안쪽만 검출 (귀퉁이 ArUco 마커·시트 밖 책상 제외). workspace_roi.py
    sheet_edge_margin_mm: 3.0    # 시트 가장자리에서 안쪽으로 뺄 여백. 초기값, 실제 촬영으로 조정
    sheet_marker_margin_mm: 5.0  # 마커 정사각형 바깥으로 더 뺄 여백. 초기값, 실제 촬영으로 조정
    # 시차 보정 (calibrator.px_to_mm): 실물은 아직 끔. 11-20 화면 안내선 정답 30장에서는 켜면 1.86 → 2.43 mm 로 나빠졌는데,
    # 그 정답이 '화면에 보이는 위치' 에 맞춰 놓은 것이라 정답에도 같은 시차가 들어 있어 판단할 수 없다 (WEEK3 동경 11-20).
    # 다음 주 인쇄 시트 정답으로 켠 값·끈 값을 비교한 뒤 정한다. 켤 때 값: ["screw", "nut"] / [4.0, 3.25]
    parallax_part_types: [""]
    parallax_heights_mm: [0.0]

robot_bridge:
  ros__parameters:
    robot_host: "127.0.0.1"
    robot_port: 9000
    ack_timeout_s: 1.0           # 이 시간 안에 ACK 가 없으면 송신 실패로 기록
